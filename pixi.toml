[workspace]
authors = ["Sudoer <hhj@sudoer.cn>"]
channels = ["conda-forge"]
name = "nga_backupper"
platforms = ["linux-64", "osx-arm64", "win-64"]
version = "0.1.0"

[tasks]
typecheck = "pyright -p pyrightconfig.strict.json"
test = "pytest -q"
main = "python main.py"
ankebak = "python main.py backup auto"
web-install = "pnpm --dir web install --frozen-lockfile"
web-build = { depends-on = ["web-install"], cmd = "pnpm --dir web build" }
web-typecheck = { depends-on = ["web-install"], cmd = "pnpm --dir web typecheck" }
web-test = { depends-on = ["web-install"], cmd = "pnpm --dir web test" }
web-serve = "python main.py web serve"

[dependencies]
python = ">=3.14.6,<3.15"
requests = ">=2.34.2,<3"
aiohttp = ">=3.14.1,<4"
bs4 = ">=4.15.0,<5"
pillow = ">=12.3.0,<13"
openai = ">=2.45.0,<3"
openpyxl = ">=3.1.5,<4"
pyright = ">=1.1.411,<2"
rich = ">=15.0.0,<16"
pytest = ">=9.1.1,<10"
weasyprint = ">=69.0,<70"
font-ttf-noto-cjk = ">=2.4,<3"
font-ttf-noto-emoji = ">=2.34,<3"
poppler = ">=26.7.0,<27"
nodejs = ">=26.4.0,<26.6"
pnpm = ">=11.13.0,<12"
fastapi-core = ">=0.139.0,<0.140"
uvicorn = ">=0.51.0,<0.52"
nh3 = ">=0.3.6,<0.4"
filelock = ">=3.29.7,<4"
pillow-heif = ">=1.4.0,<2"
imagecodecs = ">=2026.6.26,<2027"
httpx2 = ">=2.7.0,<3"
tinytag = ">=2.2.1,<3"

[pypi-dependencies]
bbcode = ">=1.1.0, <2"
imagededup = ">=0.3.3.post2, <0.4"


torch = {
    version = "*",
    index = "https://download.pytorch.org/whl/cpu"
}

torchvision = {
    version = "*",
    index = "https://download.pytorch.org/whl/cpu"
}