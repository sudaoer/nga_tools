[workspace]
authors = ["Sudoer <hhj@sudoer.cn>"]
channels = ["conda-forge"]
name = "nga_backupper"
platforms = ["linux-64", "osx-64", "osx-arm64", "win-64"]
version = "0.1.0"

[tasks]
typecheck = "pyright -p pyrightconfig.strict.json"
main = "python main.py"
ankebak = "python main.py forum sync && python main.py backup configs"

[dependencies]
python = ">=3.14.4,<3.15"
requests = ">=2.33.1,<3"
aiohttp = ">=3.13.5,<4"
bs4 = ">=4.14.3,<5"
pillow = ">=12.2.0,<13"
openai = ">=2.33.0,<3"
openpyxl = ">=3.1.5,<4"
pyright = ">=1.1.411,<2"

[target.linux.dependencies]
weasyprint = "*"
font-ttf-noto-cjk = "*"
font-ttf-noto-emoji = "*"
poppler = "*"

[pypi-dependencies]
bbcode = ">=1.1.0, <2"
